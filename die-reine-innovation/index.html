<style>
  :root{
    --ink:#102033;
    --muted:#3a5168;
    --line:#9fd0de;
    --paper:#eef7fb;
    --card:#f7fcff;
    --teal:#0097b2;
    --mag:#e0126a;
    --cyan:#00c2d8;
    --head:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
    --ui:"Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--paper);color:var(--ink)}
  body{font-family:var(--head);-webkit-font-smoothing:antialiased;overflow:hidden}
  body::before{
    content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background:
      radial-gradient(880px 520px at 0% 0%, rgba(0,194,216,.22) 0%, transparent 62%),
      radial-gradient(720px 480px at 100% 100%, rgba(224,18,106,.14) 0%, transparent 58%),
      linear-gradient(165deg, #f4fcff, #e7f4f8 55%, #f8eef3);
    animation:drift 28s ease-in-out infinite alternate;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(0,151,178,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,151,178,.09) 1px, transparent 1px),
      linear-gradient(rgba(224,18,106,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,18,106,.05) 1px, transparent 1px);
    background-size:48px 48px, 48px 48px, 144px 144px, 144px 144px;
    animation:drift 36s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2.2%,-1.4%,0)}}
  .hud{position:fixed;z-index:10;top:18px;left:18px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--teal);text-transform:uppercase;background:rgba(238,247,251,.92);padding:6px 10px;border:1px solid var(--line);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .hud a{color:inherit;text-decoration:none}
  .hud a:hover{color:var(--mag)}
  .nav > button{
    font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink);
    background:var(--card);border:1px solid var(--teal);padding:7px 11px;cursor:pointer;border-radius:0;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  .nav button:focus-visible,.dots button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .deck{height:100%;height:100svh;position:relative;z-index:1}
  .slide{
    position:absolute;inset:0;
    display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);
    align-items:center;gap:4vw;padding:12vh 6vw 14vh 7vw;
    opacity:0;visibility:hidden;pointer-events:none;z-index:1;
  }
  .slide.on{opacity:1;visibility:visible;pointer-events:auto}
  .slide.title{grid-template-columns:1fr;padding-left:12vw;overflow:hidden}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--teal);text-transform:uppercase;margin-bottom:14px}
  .kicker::before{content:"// ";color:var(--mag)}
  h1{font-size:clamp(2.6rem,5.5vw,4.8rem);font-weight:700;line-height:1.02;max-width:12ch}
  h2{font-size:clamp(1.7rem,3vw,2.5rem);font-weight:700;line-height:1.1;margin-bottom:12px;max-width:16ch}
  h1 em,h2 em,.close em{font-style:normal;color:var(--mag);text-shadow:2px 0 0 rgba(0,194,216,.35)}
  .deckline{margin-top:16px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal)}
  .lead,.copy p{max-width:38em;font-size:clamp(1rem,1.25vw,1.12rem);font-weight:400;line-height:1.6;color:var(--muted)}
  .lead{margin-top:22px}
  .hint{margin-top:26px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--teal)}
  .copy p b{color:var(--ink);font-weight:600}
  .close{margin-top:18px;font-size:clamp(1.35rem,2.2vw,1.8rem);font-weight:700;line-height:1.2}
  .copy{position:relative;z-index:1}
  figure{min-width:0;position:relative;z-index:1}
  figcaption{margin-top:14px;font-family:var(--mono);font-size:12px;line-height:1.45;color:var(--muted);max-width:42em}
  .nav{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px}
  .nav > button{width:38px;height:38px;padding:0;font-size:18px}
  .dots{display:flex;gap:8px}
  .dots button{width:8px;height:8px;padding:0;border-radius:0;transform:rotate(45deg);border:1px solid var(--teal);background:transparent;cursor:pointer}
  .dots button.on{background:var(--teal)}

  .floaters{position:absolute;inset:0;pointer-events:none;z-index:0}
  .floater{position:absolute;width:200px;animation:floaty 8s ease-in-out infinite alternate}
  .floater:nth-child(1){right:10%;top:16%}
  .floater:nth-child(2){right:22%;top:42%;animation-delay:-3s}
  .floater:nth-child(3){right:8%;bottom:14%;animation-delay:-5s}
  .floater .win{animation:none;box-shadow:0 14px 30px rgba(27,40,56,.08)}
  @keyframes floaty{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-18px) rotate(2deg)}}

  .now{font-family:var(--mono);font-size:.95rem;line-height:1.4;color:var(--ink);min-height:2.8em;margin-bottom:12px;font-weight:500;border-left:3px solid var(--cyan);padding-left:10px}
  .desk{position:relative;height:320px}
  .placed{position:absolute;width:48%}
  .placed.src{left:0;top:4%;transform:rotate(-2.5deg)}
  .placed.dst{right:0;bottom:0;transform:rotate(2deg)}
  .placed.arrived .win{border-color:#8ec5da}
  .flyer{
    position:absolute;z-index:8;left:8%;top:18%;opacity:0;pointer-events:none;
    transition:left .85s cubic-bezier(.22,.7,.2,1), top .85s cubic-bezier(.22,.7,.2,1), opacity .35s;
  }
  .flyer.notrans{transition:none}
  .flyer.at-mid{left:34%;top:0;opacity:1}
  .flyer.at-dst{left:58%;top:62%;opacity:0}
  .pill{
    display:inline-block;padding:6px 10px;border-radius:0;
    background:#e7fbff;border:1px solid var(--cyan);color:var(--ink);
    font-family:var(--mono);font-size:12px;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    box-shadow:3px 3px 0 rgba(0,194,216,.2);
  }
  .who{display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--teal)}

  .pile{position:relative;height:460px}
  .task{
    position:absolute;left:var(--l);top:var(--t);width:min(230px,86%);
    transform:translate(-50%,-50%) rotate(var(--r));
    transition:left .7s cubic-bezier(.2,.75,.2,1), top .7s cubic-bezier(.2,.75,.2,1), transform .7s;
    background:#fff;border:1px solid var(--line);border-radius:0;padding:9px 12px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    box-shadow:4px 4px 0 rgba(0,151,178,.12);font-size:.95rem;
    display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;
  }
  .task.notrans{transition:none}
  .task.stay{border-color:var(--cyan);background:#f2fdff;font-weight:700;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.06);box-shadow:4px 4px 0 rgba(224,18,106,.16)}
  .task.gone{width:min(210px,44%);font-size:.78rem;padding:7px 8px}
  .stamp{
    border:2px solid var(--mag);color:var(--mag);background:#fff;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:1px 5px;border-radius:4px;
    transform:scale(0);transition:transform .35s;
  }
  .task.gone .stamp{transform:scale(1)}

  .shell{
    display:flex;align-items:flex-start;gap:0;position:relative;
    background:#fff;border:1px solid var(--teal);border-radius:0;padding:12px;
    clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
    box-shadow:6px 6px 0 rgba(0,151,178,.14);
  }
  .shell .main{flex:1 1 auto;min-width:0}
  .shell .side{flex:0 0 0px;opacity:0;overflow:hidden;min-width:0;transition:flex-basis .55s ease, opacity .35s ease, margin .55s ease}
  .shell.open .side{flex-basis:240px;opacity:1;margin-left:12px}
  .shell .win{height:auto;box-shadow:none}
  .result{max-height:0;opacity:0;overflow:hidden;margin:0;padding:0;transition:max-height .4s ease, opacity .35s ease, margin .35s}
  .shell.show-result .result{max-height:64px;opacity:1;margin:8px}

  .well{
    margin-top:12px;border:1px solid var(--mag);background:#fff5f8;border-radius:0;padding:10px 12px;
    min-height:64px;transition:min-height .5s ease;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  }
  .well-h{color:var(--mag);font-weight:700;margin-bottom:6px}
  .lands{display:flex;flex-wrap:wrap;gap:6px}
  .land{
    font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:0;
    background:#fff;border:1px solid var(--mag);color:var(--ink);
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .land.just{animation:drop .5s ease}
  @keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
  .meter{margin-top:12px;display:grid;gap:8px}
  .meter-note{font-size:14px;line-height:1.45;color:var(--ink);font-weight:500}
  .meter-row{display:grid;grid-template-columns:minmax(9.5em,13.5em) 1fr;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .meter-name b{display:block;letter-spacing:.08em;text-transform:uppercase}
  .meter-name small{display:block;margin-top:2px;font-family:var(--head);font-size:12px;line-height:1.3;letter-spacing:0;text-transform:none;font-weight:400;color:var(--muted)}
  .track{height:6px;border-radius:0;background:#d7eef3;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#007f99,var(--cyan));transition:width .6s ease;box-shadow:0 0 10px rgba(0,194,216,.75)}
  .track.innov i{background:linear-gradient(90deg,#a10d4c,var(--mag));box-shadow:0 0 10px rgba(224,18,106,.55)}
  .readout{margin-top:8px;font-size:14px;line-height:1.45;color:var(--ink)}
  .well-sub{font-size:12px;line-height:1.35;color:var(--muted);font-weight:400;margin:-2px 0 8px}

  .slide.finale{grid-template-columns:1fr;align-items:start;align-content:start;padding-top:11vh;gap:2vh}
  .finale-head{display:grid;grid-template-columns:minmax(240px,380px) minmax(0,1fr);gap:4vw;align-items:end}
  .finale-head h2{margin:0}
  .finale-head .now{margin:0}
  .recap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
  .lesson{
    background:#fff;border:1px solid var(--line);padding:14px 14px 16px;min-width:0;
    clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
    opacity:0;transform:translateY(18px);transition:opacity .45s ease, transform .45s ease, border-color .3s;
  }
  .lesson.in{opacity:1;transform:none}
  .lesson.on{border-color:var(--cyan);box-shadow:4px 4px 0 rgba(0,151,178,.14)}
  .lesson .lk{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
  .lesson h3{font-size:1.15rem;line-height:1.2;margin:8px 0}
  .lesson p{font-size:.95rem;line-height:1.45;color:var(--muted)}
  .sumline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
  .sumline b{color:var(--teal);font-size:.95rem}
  .sumchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .sumchips span{
    padding:6px 8px;border:1px solid var(--cyan);background:#f2fdff;font-weight:700;font-size:.9rem;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  }
  .sumchips .off{border-color:var(--line);background:#f4f7fa;color:#6d7c8d;font-weight:500;text-decoration:line-through}
  .sumchips .off i{font-style:normal;text-decoration:none;display:inline-block;margin-right:4px;border:1px solid var(--mag);color:var(--mag);padding:0 4px;font-family:var(--mono);font-size:10px;letter-spacing:.08em}
  .sumtools{list-style:none;margin-top:12px;display:grid;gap:6px}
  .sumtools li{font-family:var(--mono);font-size:12px;padding:6px 8px;border:1px solid var(--line);background:#f7fcff}
  .lesson .meter{margin-top:12px}
  .lesson .meter-row{grid-template-columns:1fr;gap:4px}
  .sumclose{margin-top:8px;font-size:clamp(1.35rem,2.2vw,1.8rem);font-weight:700;opacity:0;transform:translateY(8px);transition:opacity .4s, transform .4s}
  .sumclose.in{opacity:1;transform:none}

  .win{
    width:100%;height:auto;min-height:118px;border-radius:0;overflow:hidden;background:#fff;color:#1b1f23;
    border:1px solid var(--line);font-family:var(--ui);font-size:11px;line-height:1.35;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    box-shadow:4px 4px 0 rgba(0,151,178,.16);animation:pop .45s ease;
  }
  @keyframes pop{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .chrome{height:26px;display:flex;align-items:center;gap:6px;padding:0 8px;color:#fff;font-weight:650}
  .lights{display:flex;gap:3px}
  .lights i{width:7px;height:7px;border-radius:50%;display:block}
  .lights i:nth-child(1){background:#ff5f57}
  .lights i:nth-child(2){background:#febc2e}
  .lights i:nth-child(3){background:#28c840}
  .outlook .chrome{background:#0f6cbd}
  .excel .chrome{background:#217346}
  .teams .chrome{background:#5b5fc7}
  .datev .chrome{background:#063a70}
  .word .chrome{background:#2b579a}
  .drive .chrome{background:#fff;color:#202124;border-bottom:1px solid #e6e8eb}
  .copilot .chrome{background:#fff;color:#242424;border-bottom:1px solid #ececec}
  .chatgpt .chrome{background:#212121;color:#f4f4f4}
  .claude .chrome{background:#f6f1e7;color:#3d2c29;border-bottom:1px solid #eadfd2}
  .gemini .chrome{background:#fff;color:#202124;border-bottom:3px solid #1a73e8}
  .ki .chrome{background:#f2fdff;color:#0097b2;border-bottom:1px solid #00c2d8}
  .mail{padding:4px 0}
  .m{padding:4px 8px}
  .m b,.m span{display:block}
  .m span{color:#5c6b76;font-size:10px}
  .line.hot{background:#e5f4ff;box-shadow:inset 3px 0 0 var(--teal)}
  .line.lifted{background:#f4fbfe;outline:1px dashed var(--teal);outline-offset:-2px}
  .sheet{display:grid;grid-template-columns:1.3fr .5fr .7fr;gap:1px;background:#d5ddd8;margin:8px}
  .sheet span{background:#fff;padding:3px 4px;font-size:10px;min-height:18px}
  .sheet .hd{background:#e7f4ec;color:#0e5c32;font-weight:700}
  .sheet .wait{box-shadow:inset 0 -1px 0 #b7cfc2}
  .sheet .sel{background:#c6efce;color:#145c32;font-weight:650}
  .bub{margin:8px;padding:6px 8px;border-radius:8px;background:#efeefe;color:#2a2a4a;font-size:11px}
  .bub.me{background:#5b5fc7;color:#fff}
  .inv{padding:8px;font-size:11px;color:#16324f}
  .inv .top{font-weight:700;margin-bottom:4px}
  .inv .ln{display:flex;justify-content:space-between;padding:2px 0;border-top:1px solid #e4ebf2;min-height:18px}
  .inv .ln.sel{background:#e5f4ea}
  .pagelet{margin:8px;border:1px solid #d7e2f2;padding:8px}
  .pagelet b{display:block;color:#2b579a;margin-bottom:4px}
  .files{padding:6px 0}
  .file{display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:11px}
  .file u{width:14px;height:16px;border-radius:2px;text-decoration:none;flex:none}
  .file.pdf u{background:#e23b2f}
  .file.doc u{background:#2b579a}
  .ask,.done,.you,.ai,.gdoc{margin:8px;font-size:11px}
  .ask,.done{padding:6px;border-radius:8px;background:#f4f6fb}
  .done{background:#eef4ff}
  .you{padding:6px;border-radius:8px;background:#2f2f2f;color:#eee}
  .chatgpt{background:#171717;color:#eee}
  .chatgpt .ai{color:#ececec}
  .claude{background:#f7f3ec;color:#3d2c29}
  .docchip{display:inline-block;margin:8px;padding:4px 6px;border-radius:6px;background:#fff;border:1px solid #e4d8c8}
  .spark{width:8px;height:8px;border-radius:2px;background:#1a73e8}
  .gemini .chrome{border-image:linear-gradient(90deg,#1a73e8,#ea4335,#fbbc04,#34a853) 1}

  @media (max-width:860px){
    .hud{top:max(10px,env(safe-area-inset-top));left:12px;max-width:calc(100% - 24px);letter-spacing:.08em;font-size:10px}
    .slide,.slide.title{
      grid-template-columns:1fr;align-content:start;
      padding:64px 18px calc(84px + env(safe-area-inset-bottom));
      gap:12px;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    }
    .floaters{display:none}
    h1{font-size:2.15rem;max-width:none}
    h2{font-size:1.35rem;max-width:none}
    .kicker{letter-spacing:.08em;font-size:11px;margin-bottom:8px}
    .lead,.copy p{font-size:1rem;line-height:1.45}
    .now{font-size:.9rem;min-height:0}
    .deck::after{
      content:"";position:fixed;z-index:9;top:0;left:0;right:0;pointer-events:none;
      height:calc(52px + env(safe-area-inset-top));
      background:linear-gradient(#eef7fb 62%, rgba(238,247,251,0));
    }
    .desk{height:230px}
    .placed{width:88%}
    .placed.src,.placed.dst{transform:none}
    .pile{height:280px}
    .task{width:min(250px,82%);font-size:.88rem;white-space:normal}
    .task.gone{width:46%;font-size:.72rem}
    .shell{flex-direction:column;padding:8px}
    .shell.open .side{flex-basis:auto;margin-left:0;margin-top:8px}
    .win{min-height:0}
    .meter-row{grid-template-columns:1fr;gap:4px}
    .nav{bottom:max(10px,env(safe-area-inset-bottom));gap:6px}
    .nav > button{width:44px;height:44px}
    .dots{gap:2px}
    .dots button{width:36px;height:36px;border-color:transparent;background:transparent;transform:none}
    .dots button::before{
      content:"";display:block;width:8px;height:8px;margin:13px auto 0;
      transform:rotate(45deg);border:1px solid var(--teal);background:transparent;
    }
    .dots button.on{background:transparent}
    .dots button.on::before{background:var(--teal)}
    .slide.finale{padding-top:64px}
    .finale-head{grid-template-columns:1fr;gap:10px}
    .recap{grid-template-columns:1fr}
    .lesson:not(.in){display:none}
    .lesson h3{font-size:1.05rem}
    .sumchips span{white-space:nowrap}
  }
  @media (max-width:860px) and (max-height:700px){
    h1{font-size:1.9rem}
    h2{font-size:1.2rem}
    .lead,.copy p{font-size:.95rem}
    .desk{height:190px}
    .pile{height:220px}
  }
  @media (prefers-reduced-motion:reduce){
    body::before,body::after,.floater,.win,.now,.flyer,.lesson,.sumclose,.task,.side,.placed,.shell,.track i,.land.just,.result,.well{
      animation:none !important;transition:none !important;
    }
  }
</style>
</head>

<div class="hud"><a href="../index.html">Concepts</a> · <span id="hudIdx">01 / 05</span></div>

  const $ = s => document.querySelector(s);
  let lang = 'de';
  let index = 0;
  let seen = { lang: '', t: -1, c: -1, s: -1, a: -1, f: -1 };

  function chrome(name, title, body) {
    const el = document.createElement('div');
    el.className = 'win ' + (name.indexOf('ki') === 0 ? 'ki' : name);
    const mark = (name === 'ki' || name.indexOf('ki') === 0)
      ? '<span class="spark"></span>'
      : '<span class="lights"><i></i><i></i><i></i></span>';
    el.innerHTML = '<div class="chrome">' + mark + '<b>' + title + '</b></div>' + body;
    return el;
  }
  function makeWin(name, pack, opt) {
    opt = opt || {};
    const mark = (opt.hot ? ' hot' : '') + (opt.lifted ? ' lifted' : '');
    const blank = '\u00a0';
    if (name === 'outlook') return chrome('outlook', pack.appMail, '<div class="mail"><div class="m line' + mark + '"><b>' + pack.mailWho + '</b><span>' + pack.tokens[0] + '</span></div><div class="m"><b>' + pack.mail2 + '</b><span>' + pack.invShort + '</span></div></div>');
    if (name === 'excel') {
      const cls = opt.filled ? 'sel' : 'wait';
      const a = opt.filled ? pack.item : blank;
      const b = opt.filled ? pack.qty : blank;
      const c = opt.filled ? pack.price : blank;
      return chrome('excel', pack.appSheet, '<div class="sheet"><span class="hd">' + pack.colA + '</span><span class="hd">' + pack.colB + '</span><span class="hd">' + pack.colC + '</span><span class="' + cls + '">' + a + '</span><span class="' + cls + '">' + b + '</span><span class="' + cls + '">' + c + '</span></div>');
    }
    if (name === 'teams') return chrome('teams', pack.appChat, '<div class="bub line' + mark + '">' + pack.teamsBub + '</div><div class="bub me">' + pack.teamsMe + '</div>');
    if (name === 'datev') return chrome('datev', pack.appBooks, '<div class="inv"><div class="top">' + pack.voucher + '</div><div class="ln' + (opt.filled ? ' sel' : '') + '"><span>' + (opt.filled ? pack.datevWho : blank) + '</span><span>' + (opt.filled ? pack.datevAmt : blank) + '</span></div></div>');
    if (name === 'word') return chrome('word', pack.appText, '<div class="pagelet line' + mark + '"><b>' + pack.wordTitle + '</b>' + pack.wordLine + '</div>');
    if (name === 'drive') return chrome('drive', pack.appFiles, '<div class="files"><div class="file pdf line' + mark + '"><u></u>' + pack.pdfName + '</div><div class="file doc"><u></u>' + pack.docName + '</div></div>');
    if (name.indexOf('ki') === 0) {
      const i = Number(name.slice(2)) || 0;
      return chrome('ki', pack.appAi, '<div class="ask">' + pack.kiAsk[i] + '</div><div class="done result">' + pack.kiDone[i] + '</div>');
    }
    return chrome(name, name, '');
  }
  function mount(id, name, pack, opt) {
    const slot = $(id);
    slot.replaceChildren(makeWin(name, pack, opt));
  }
  function setFilled(root, name, pack, filled) {
    const blank = '\u00a0';
    if (name === 'excel') {
      const cells = [...root.querySelectorAll('.sheet span')].filter(s => !s.classList.contains('hd'));
      const vals = filled ? [pack.item, pack.qty, pack.price] : [blank, blank, blank];
      cells.forEach((c, i) => {
        c.textContent = vals[i];
        c.className = filled ? 'sel' : 'wait';
      });
    }
    if (name === 'datev') {
      const ln = root.querySelector('.ln');
      if (!ln) return;
      ln.classList.toggle('sel', filled);
      ln.children[0].textContent = filled ? pack.datevWho : blank;
      ln.children[1].textContent = filled ? pack.datevAmt : blank;
    }
  }
  function setLine(root, hot, lifted) {
    const line = root.querySelector('.line');
    if (!line) return;
    line.classList.toggle('hot', hot);
    line.classList.toggle('lifted', lifted);
  }
  function setNow(el, text) {
    if (el.textContent === text) return;
    el.textContent = text;
    if (reduced) return;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }
  function place(el, spot) {
    el.style.setProperty('--l', spot[0]);
    el.style.setProperty('--t', spot[1]);
    el.style.setProperty('--r', spot[2]);
  }

  function paintFloaters(pack) {
    const box = $('#floaters');
    box.replaceChildren();
    ['outlook', 'excel', 'ki0'].forEach(name => {
      const wrap = document.createElement('div');
      wrap.className = 'floater';
      wrap.appendChild(makeWin(name, pack, { filled: true }));
      box.appendChild(wrap);
    });
  }
  function paintT(beat, pack) {
    const scene = beat < 3 ? 0 : 1;
    const sub = beat % 3;
    const desk = $('#deskT');
    const token = scene === 0 ? pack.tokens[0] : pack.voucher;
    if (desk.dataset.scene !== String(scene) || desk.dataset.lang !== lang) {
      mount('#srcT', scene === 0 ? 'outlook' : 'teams', pack, { hot: sub === 0, lifted: sub > 0 });
      mount('#dstT', scene === 0 ? 'excel' : 'datev', pack, { filled: sub === 2 });
      desk.dataset.scene = String(scene);
      desk.dataset.lang = lang;
      const fly = $('#flyT');
      fly.classList.add('notrans');
      fly.classList.remove('at-mid', 'at-dst');
      void fly.offsetWidth;
      fly.classList.remove('notrans');
    } else {
      setLine($('#srcT'), sub === 0, sub > 0);
      setFilled($('#dstT'), scene === 0 ? 'excel' : 'datev', pack, sub === 2);
    }
    $('#dstT').classList.toggle('arrived', sub === 2);
    $('#flyText').textContent = token;
    $('#flyWho').textContent = pack.human;
    const fly = $('#flyT');
    fly.classList.toggle('at-mid', sub === 1);
    fly.classList.toggle('at-dst', sub === 2);
    setNow($('#nowT'), pack.tLines[beat]);
  }
  function paintC(beat, pack) {
    const pile = $('#pile');
    let fresh = false;
    if (pile.dataset.lang !== lang || pile.children.length !== 7) {
      fresh = true;
      pile.dataset.lang = lang;
      pile.replaceChildren();
      pack.cubes.forEach((label, i) => {
        const el = document.createElement('div');
        el.className = 'task notrans';
        el.innerHTML = (i < 4 ? '<span class="stamp">' + pack.stamp + '</span>' : '') + '<span>' + label + '</span>';
        pile.appendChild(el);
      });
    }
    const park = parked;
    if (beat < seen.c) pile.querySelectorAll('.task').forEach(el => el.classList.add('notrans'));
    [...pile.children].forEach((el, i) => {
      const copyTask = i < 4;
      const gone = copyTask && beat > i;
      el.classList.toggle('gone', gone);
      el.classList.toggle('stay', !copyTask && beat >= 5);
      place(el, gone ? park[i] : (!copyTask && beat >= 5 ? kept[i - 4] : mixed[i]));
      el.style.zIndex = gone ? '1' : String(8 - i);
    });
    if (fresh || beat < seen.c) {
      void pile.offsetWidth;
      pile.querySelectorAll('.task').forEach(el => el.classList.remove('notrans'));
    }
    setNow($('#nowC'), pack.cNow[beat]);
  }
  function paintPair(beat, pack, per, shellId, mainId, sideId, nowId, lines, showResult) {
    const pair = Math.floor(beat / per);
    const sub = beat % per;
    const shell = $(shellId);
    const spec = pairs[pair];
    if (shell.dataset.pair !== String(pair) || shell.dataset.lang !== lang) {
      mount(mainId, spec[0], pack, { hot: sub === 0, lifted: sub > 0 });
      mount(sideId, spec[1], pack, {});
      shell.dataset.pair = String(pair);
      shell.dataset.lang = lang;
    } else {
      setLine($(mainId), sub === 0, sub > 0);
    }
    shell.classList.toggle('open', sub >= 1);
    shell.classList.toggle('show-result', showResult(sub));
    setNow($(nowId), lines[beat]);
  }
  function paintF(beat, pack) {
    const cards = [...document.querySelectorAll('#recap .lesson')];
    const done = beat >= 3;
    cards.forEach((el, i) => {
      el.classList.toggle('in', beat >= i);
      el.classList.toggle('on', beat < 4 ? beat === i : true);
    });
    $('#sumTok').textContent = pack.tokens[0];
    $('#sumWho').textContent = pack.human;
    $('#transF').style.width = done ? '0%' : '100%';
    $('#innovF').style.width = done ? '100%' : '0%';
    $('#readF').textContent = pack.barLines[done ? 4 : 0];
    $('#sumClose').classList.toggle('in', beat >= 4);
    setNow($('#nowF'), pack.fLines[beat]);
  }

  const slides = [...document.querySelectorAll('.slide')];
  const dotBtns = slides.map((_, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.addEventListener('click', () => show(i));
    $('#dots').appendChild(b);
    return b;
  });
  function show(i) {
    index = (i + slides.length) % slides.length;
    slides.forEach((s, n) => {
      const on = n === index;
      s.classList.toggle('on', on);
      s.setAttribute('aria-hidden', on ? 'false' : 'true');
    });
    dotBtns.forEach((b, n) => {
      b.classList.toggle('on', n === index);
      b.setAttribute('aria-current', n === index ? 'true' : 'false');
    });
    $('#hudIdx').textContent = String(index + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
  }
  function applyLang(next) {
    lang = next === 'en' ? 'en' : 'de';
    const pack = copy[lang];
    document.documentElement.lang = lang;
    document.title = pack.docTitle;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = pack[el.dataset.i18n] || ''; });
    document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = pack[el.dataset.i18nHtml] || ''; });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', pack[el.dataset.i18nAria] || ''));
    document.querySelector('nav.nav').setAttribute('aria-label', pack.nav);
    dotBtns.forEach((b, i) => b.setAttribute('aria-label', pack.goto + ' ' + (i + 1)));
    $('#deskT').dataset.lang = '';
    $('#pile').dataset.lang = '';
    $('#shellS').dataset.lang = '';
    $('#shellA').dataset.lang = '';
    $('#lands').dataset.lang = '';
    seen.lang = '';
    paintFloaters(pack);
    try { localStorage.setItem('konzept-lang', lang); } catch (err) {}
  }

  $('#prev').addEventListener('click', () => show(index - 1));
  $('#next').addEventListener('click', () => show(index + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); show(index + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(index - 1); }
  });
  let swipeX = null;
  $('#deck').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; swipeX = e.clientX; });
  $('#deck').addEventListener('pointerup', e => {
    if (swipeX == null) return;
    const dx = e.clientX - swipeX;
    swipeX = null;
    if (Math.abs(dx) > 56) show(index + (dx < 0 ? 1 : -1));
  });

  try { lang = localStorage.getItem('konzept-lang') === 'en' ? 'en' : 'de'; } catch (err) {}
  applyLang(lang);
  show(0);

  function beat(n, now) { return reduced ? n - 1 : Math.floor(now / BEAT) % n; }
  function frame(now) {
    const pack = copy[lang];
    const t = beat(6, now);
    const c = beat(6, now);
    const s = beat(8, now);
    const a = beat(12, now);
    const f = beat(8, now);
    if (t !== seen.t || lang !== seen.lang) paintT(t, pack);
    if (c !== seen.c || lang !== seen.lang) paintC(c, pack);
    if (s !== seen.s || lang !== seen.lang) paintPair(s, pack, 2, '#shellS', '#mainS', '#sideS', '#nowS', pack.sLines, sub => sub >= 1);
    if (a !== seen.a || lang !== seen.lang) {
      paintPair(a, pack, 3, '#shellA', '#mainA', '#sideA', '#nowA', pack.aLines, sub => sub === 2);
      const done = Math.floor(a / 3) + (a % 3 === 2 ? 1 : 0);
      const innov = done / 4;
      $('#transBar').style.width = ((1 - innov) * 100) + '%';
      $('#innovBar').style.width = (innov * 100) + '%';
      $('#readout').textContent = pack.barLines[done];
      $('#wellH').textContent = pack.core;
      $('#well').style.minHeight = (64 + done * 18) + 'px';
      const lands = $('#lands');
      if (lands.childElementCount !== done || lands.dataset.lang !== lang) {
        lands.dataset.lang = lang;
        lands.replaceChildren();
        for (let i = 0; i < done; i++) {
          const d = document.createElement('span');
          d.className = 'land' + (i === done - 1 ? ' just' : '');
          d.textContent = pack.tokens[i];
          lands.appendChild(d);
        }
      }
    }
    if (f !== seen.f || lang !== seen.lang) paintF(f, pack);
    seen = { lang, t, c, s, a, f };
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
