<html lang="de">
<head>

<link href="fonts/fonts.css" rel="stylesheet">
<style>
  html{color-scheme:dark}
  :root{
    --ink:#e8f6fb;--muted:#a9c0ce;--paper:#07141c;--line:#245064;
    --card:#102430;--teal:#4fd4ea;--mag:#ff4d8d;--cyan:#7eebf7;
    --head:"Chakra Petch","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;background:var(--paper);color:var(--ink)}
  body{
    min-height:100svh;font-family:var(--head);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:12vh 6vw 11vh;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background:
      radial-gradient(880px 520px at 8% 0%, rgba(0,194,216,.34) 0%, transparent 62%),
      radial-gradient(720px 480px at 100% 100%, rgba(224,18,106,.26) 0%, transparent 58%),
      linear-gradient(165deg,#07141c,#0c1c28 55%,#140e16);
    animation:drift 28s ease-in-out infinite alternate;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(0,151,178,.16) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,151,178,.16) 1px, transparent 1px),
      linear-gradient(rgba(224,18,106,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,18,106,.08) 1px, transparent 1px);
    background-size:48px 48px,48px 48px,144px 144px,144px 144px;
    animation:drift 36s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-2.2%,-1.4%,0)}}
  .lang{position:fixed;z-index:30;top:22px;right:6vw;display:flex}
  .lang button{
    font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);background:rgba(7,20,28,.92);border:1px solid var(--line);
    padding:6px 10px;cursor:pointer;
  }
  .lang button+button{margin-left:-1px}
  .lang button.on{position:relative;z-index:1;color:var(--ink);border-color:var(--ink)}
  .lang button:focus-visible,.topics a:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .home{
    position:relative;z-index:1;width:min(1080px,100%);
    display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,520px);
    gap:6vw;align-items:center;
  }
  h1{
    font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:500;color:var(--teal);margin-bottom:1.4rem;
  }
  h1::before{content:"// ";color:var(--mag)}
  .topics{list-style:none}
  .topics a{
    display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px;
    padding:1.15rem 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;
  }
  .topics li:last-child a{border-bottom:1px solid var(--line)}
  .topics em{
    grid-row:1 / span 2;align-self:center;font-family:var(--mono);font-style:normal;
    font-size:12px;letter-spacing:.16em;color:var(--teal);
  }
  .topics strong{font-size:clamp(1.7rem,3vw,2.45rem);font-weight:700;letter-spacing:-.03em;line-height:1.02}
  .topics span{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .topics a:hover strong,.topics a:hover em{color:var(--mag)}
  .atom{
    width:min(100%,50vh,480px);aspect-ratio:1;margin-inline:auto;position:relative;
    perspective:900px;transform-style:preserve-3d;
  }
  .spin{
    position:absolute;inset:0;transform-style:preserve-3d;
    animation:tumble 26s ease-in-out infinite alternate;
  }
  @keyframes tumble{
    from{transform:rotateX(-14deg) rotateY(-22deg)}
    to{transform:rotateX(16deg) rotateY(26deg)}
  }
  .ring{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--y)) rotateX(var(--x))}
  .hoop,.track{
    position:absolute;left:12%;top:12%;width:76%;height:76%;border-radius:50%;
    transform-style:preserve-3d;
  }
  .hoop{border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
  .track{container-type:size;animation:ride var(--dur) linear infinite;animation-direction:var(--dir,normal)}
  @keyframes ride{to{transform:rotateZ(360deg)}}
  .track>b{
    position:absolute;left:50%;top:-6px;width:14px;height:14px;margin-left:-7px;
    transform-origin:7px calc(50cqb + 6px);transform:rotate(var(--a));
    transform-style:preserve-3d;background:none;
  }
  .r1{--x:72deg;--y:0deg;--dur:18s;--c:#4fd4ea}
  .r2{--x:72deg;--y:60deg;--dur:26s;--dir:reverse;--c:#ff4d8d}
  .r3{--x:72deg;--y:120deg;--dur:34s;--c:#7eebf7}
  .core{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
  .core span{position:absolute;width:42px;height:42px;margin:-21px;transform-style:preserve-3d;transform:translate3d(var(--px),var(--py),var(--pz))}
  .core .n1{--px:-15px;--py:-9px;--pz:14px;--c:#4fd4ea}
  .core .n2{--px:16px;--py:-7px;--pz:-12px;--c:#ff4d8d}
  .core .n3{--px:-1px;--py:15px;--pz:2px;--c:#7eebf7}
  .body,.globe,.mer{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d}
  .body{
    background:
      radial-gradient(circle at 32% 28%,#fff 0%,rgba(255,255,255,.4) 12%,transparent 28%),
      radial-gradient(circle at 55% 62%,var(--c) 0%,#102430 70%);
    box-shadow:inset -8px -10px 14px rgba(0,0,0,.35);
  }
  .globe{animation:ballspin 28s linear infinite}
  @keyframes ballspin{to{transform:rotateY(360deg)}}
  .mer{
    background:radial-gradient(circle at 34% 30%,#fff 0%,var(--c) 28%,#102430 74%);
    transform:rotateY(var(--ry));
  }
  footer{
    position:fixed;z-index:5;left:0;right:0;bottom:16px;text-align:center;
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  }
  footer a{color:var(--muted);text-decoration:none;margin:0 .45rem}
  footer a:hover{color:var(--ink)}
  @media (max-width:860px){
    body{overflow:auto;padding:84px 20px 88px;place-items:start center}
    .home{grid-template-columns:1fr;gap:28px}
    .atom{order:-1;width:min(100%,68vw,380px)}
    .lang{right:16px;top:max(12px,env(safe-area-inset-top))}
    footer{bottom:max(12px,env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){
    body::before,body::after,.spin,.track,.globe{animation:none}
    .spin{transform:rotateX(18deg) rotateY(-32deg)}
  }
</style>
</head>
<body>
  <div class="lang" role="group">
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="de" aria-pressed="true">DE</button>
  </div>
  <main class="home">
    <div>
      <h1>Concepts</h1>
      <ul class="topics">
        <li>
          <a href="die-reine-innovation/index.html">
            <em>01</em>
            <strong data-i18n="t1">Die reine Innovation</strong>
            <span data-i18n="d1">KI-Automatisierung</span>
          </a>
        </li>
        <li>
          <a href="ai-powered-human-art/index.html">
            <em>02</em>
            <strong data-i18n="t2">KI-gestützte menschliche Kunst</strong>
            <span data-i18n="d2">Konzept, dann Handwerk</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="atom" aria-hidden="true">
      <div class="spin">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"><span class="n1"></span><span class="n2"></span><span class="n3"></span></div>
      </div>
    </div>
  </main>
<script>
  var copy = {
    de: {
      t1: 'Die reine Innovation', d1: 'KI-Automatisierung',
      t2: 'KI-gestützte menschliche Kunst', d2: 'Konzept, dann Handwerk'
    },
    en: {
      t1: 'The pure innovation', d1: 'AI automation',
      t2: 'AI powered human art', d2: 'Concept, then craft'
    }
  };
  function apply(next) {
    var lang = next === 'en' ? 'en' : 'de';
    var pack = copy[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      if (pack[el.dataset.i18n]) el.textContent = pack[el.dataset.i18n];
    });
    document.querySelectorAll('.lang button').forEach(function (b) {
      var on = b.dataset.lang === lang;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    try { localStorage.setItem('konzept-lang', lang); } catch (err) {}
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.lang); });
  });
  var saved = 'de';
  try { saved = localStorage.getItem('konzept-lang') === 'en' ? 'en' : 'de'; } catch (err) {}
  apply(saved);
  function makeBall(el) {
    var body = document.createElement('i');
    body.className = 'body';
    el.appendChild(body);
  }
  document.querySelectorAll('.core span').forEach(makeBall);
  document.querySelectorAll('.ring').forEach(function (ring) {
    var hoop = document.createElement('div');
    hoop.className = 'hoop';
    ring.appendChild(hoop);
    var track = document.createElement('div');
    track.className = 'track';
    var ball = document.createElement('b');
    ball.style.setProperty('--a', '0deg');
    track.appendChild(ball);
    var globe = document.createElement('span');
    globe.className = 'globe';
    for (var n = 0; n < 4; n++) {
      var slice = document.createElement('i');
      slice.className = 'mer';
      slice.style.setProperty('--ry', (n * 45) + 'deg');
      globe.appendChild(slice);
    }
    ball.appendChild(globe);
    ring.appendChild(track);
  });
</script>
<footer><a id="lg-imp" data-p="" href="impressum.html">Impressum</a> <a id="lg-priv" href="datenschutz.html">Datenschutz</a></footer><script>(function(){function L(){var l="de";try{l=localStorage.getItem("konzept-lang")==="en"?"en":"de"}catch(e){}var a=document.getElementById("lg-imp"),b=document.getElementById("lg-priv"),p=a.dataset.p;if(l==="en"){a.href=p+"legal-notice.html";a.textContent="Legal Notice";b.href=p+"privacy.html";b.textContent="Privacy Policy"}else{a.href=p+"impressum.html";a.textContent="Impressum";b.href=p+"datenschutz.html";b.textContent="Datenschutz"}}L();document.addEventListener("click",function(){setTimeout(L,0)},true)})();</script>
</body>
</html>
